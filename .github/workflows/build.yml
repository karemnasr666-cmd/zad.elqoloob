name: Build Zad Al Qolob APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'zad_alqolob_1_code/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare bundled offline content
        working-directory: zad_alqolob_1_code
        run: python3 scripts/prepare_offline_data.py

      - name: Build debug APK
        working-directory: zad_alqolob_1_code/android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zad-alqolob-debug-apk
          path: zad_alqolob_1_code/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
